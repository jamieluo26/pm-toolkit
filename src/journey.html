<!doctype html><html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ 完整案例走读</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#242f2c;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;line-height:1.85}main{max-width:960px;margin:56px auto;padding:0 28px}small{font-size:12px;letter-spacing:.12em;color:#66776d}h1{font-size:clamp(32px,5vw,52px);line-height:1.2;letter-spacing:-.04em;margin:22px 0}h2{font-size:27px;line-height:1.4;margin:12px 0 24px}header{padding-bottom:30px;border-bottom:1px solid #cad2c8}section{padding:40px 0;border-bottom:1px solid #d4dbd1}a{color:#28664b;text-underline-offset:4px}a:focus-visible,summary:focus-visible{outline:3px solid #be682f;outline-offset:4px}span{color:#6c7a70}summary{cursor:pointer;color:#28664b}details{padding:16px 0}.links{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.links a{display:inline-block;padding:10px 16px;border:1px solid #acc1b1;background:white;border-radius:7px;text-decoration:none}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid #d0d8cf;padding:14px;text-align:left;min-width:150px}th{background:#e8ede5}footer{padding:30px 0;color:#68796e;font-size:14px}@media(max-width:600px){main{margin:30px auto;padding:0 20px}section{padding:28px 0}}</style></head><body><main><header><small>PM TOOLKIT / WORKED EXAMPLE</small><h1>__TITLE__</h1><p>从给定讨论、产品简报，到可交互原型和可编辑交接文档。版本 __EDITION__；来源类型 __SOURCE_KIND__。</p><p>synthetic 表示人工合成设定；user-supplied 表示使用者提供的材料。两者都不意味着工具确认了真实权属、事实或人的批准。</p></header>__STEPS__<footer>材料可以再生成，决定需要依据。修改自己的材料时先填空白模板，再用明确的版本记录观察。</footer></main></body></html>
