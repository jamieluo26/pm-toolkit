<!doctype html>
<html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ 演示原型</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#20332a;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1040px;margin:64px auto;padding:0 28px}a{color:#286a4d}small{letter-spacing:.12em;color:#617769}h1{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;margin:20px 0 12px}p{line-height:1.8}.muted{color:#63756a}.filter{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 20px}button{border:1px solid #bccbc1;background:white;border-radius:24px;padding:10px 19px;font:inherit;color:#284d39;cursor:pointer}button[aria-pressed=true]{background:#245b41;border-color:#245b41;color:white}button:focus-visible,a:focus-visible{outline:3px solid #cb692c;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.book{background:white;border:1px solid #dce4de;border-radius:14px;padding:24px}.book h2{margin:0 0 12px;font-size:22px}.book p{margin:0;color:#617769}.empty{padding:54px 24px;border:1px dashed #aabeb0;border-radius:14px;text-align:center}.bottom{border-top:1px solid #d7e0d9;margin-top:36px;padding-top:22px;font-size:14px}#count{font-size:14px;color:#52685a;margin:12px 0 18px} @media(max-width:600px){main{margin:28px auto;padding:0 20px}.grid{grid-template-columns:1fr}}
</style></head><body><main><a href="handoff.md">查看交接记录</a><p><small>WORKED EXAMPLE / LOCAL PROTOTYPE</small></p><h1 id="title"></h1><p id="scope" class="muted"></p><div class="filter" role="group" aria-label="主题筛选" id="filters"></div><p id="count" role="status" aria-live="polite"></p><section id="books" class="grid" aria-label="阅读清单"></section><p id="empty" class="empty" hidden>这个主题还没有书目。选择“全部”可返回完整清单。</p><p class="bottom">给定书目展示 · 单主题筛选与返回全部 · 空结果提示<br>这是本地交互演示。刷新后恢复全部；不保存或上传数据，不包含登录、云同步或业务导出。</p></main>
<script type="application/json" id="case-data">__CASE_DATA__</script><script>
'use strict';const data=JSON.parse(document.getElementById('case-data').textContent);document.getElementById('title').textContent=data.title;document.getElementById('scope').textContent=(data.sourceKind==='synthetic'?'所有讨论、书目与规则均为人工合成设定。':'按使用者给定材料演示，不核验材料权属或事实。')+' 版本 '+data.edition;const group=document.getElementById('filters');const list=document.getElementById('books');let selected='全部';function draw(){for(const b of group.children)b.setAttribute('aria-pressed',String(b.textContent===selected));const rows=selected==='全部'?data.books:data.books.filter(b=>b.themes.includes(selected));list.replaceChildren();for(const row of rows){const card=document.createElement('article');card.className='book';const h=document.createElement('h2');h.textContent=row.title;const p=document.createElement('p');p.textContent=row.themes.join(' / ');card.append(h,p);list.append(card)}document.getElementById('count').textContent=selected+' · '+rows.length+' 本';document.getElementById('empty').hidden=rows.length!==0}for(const name of ['全部',...data.themes]){const b=document.createElement('button');b.type='button';b.textContent=name;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{selected=name;draw()});group.append(b)}draw();
</script></body></html>
