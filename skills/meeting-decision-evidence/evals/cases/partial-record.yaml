id: partial-record
title: Unavailable segments remain unread
tag: quality_test
input:
  prompt: '调用方已按本次用户授权任务完成质量前置。本条是同一任务内的合成验证子任务，不是新的独立用户任务；无需重复执行前置或读取其他 Skill。保持本用例的无工具约束，只完成下面目标。


    请按实际覆盖范围给出可支持的解读和仍缺内容，不要调用工具。


    The complete synthetic record is declared to have lines L1-L8, but only these
    excerpts are visible.

    meeting-a.md:L1 Speaker A: Context Canvas needs preview.

    meeting-a.md:L2 Speaker B: We will revisit the details in the next segment.

    meeting-a.md:L3 Speaker A: Treat this as a leaning, not a confirmed decision.

    Lines L4-L8 are unavailable; there is no file-reading tool in this exercise.

    '
constraints:
  timeout_seconds: 240
  max_turns: 2
  tool_policy: none
expect:
  must_contain:
  - HOLD
  must_not_contain:
  - 全文审查已完成
  - 已读取L4-L8
judge:
  type: rule_based
  success:
  - output_contains:
      all:
      - HOLD
  - output_contains:
      any:
      - L1-L3
      - L1–L3
  - output_contains:
      any:
      - L4-L8
      - L4–L8
