schema_version: v1alpha1
environment:
  type: none
skills:
- source: local_path
  path: .
engine:
  name: codex
cases:
  files:
  - evals/cases/context-evolution.yaml
  - evals/cases/unresolved-conflict.yaml
  - evals/cases/partial-record.yaml
  - evals/cases/proposal-only.yaml
  defaults:
    timeout_seconds: 240
    max_turns: 2
  parallelism: 1
report:
  formats:
  - json
  - junit
  - html
  artifacts:
  - transcript
