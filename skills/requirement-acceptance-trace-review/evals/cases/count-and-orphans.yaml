id: count-and-orphans
title: Equal totals do not establish trace coverage
tag: quality_test
input:
  prompt: '调用方已按本次用户授权任务完成质量前置。本条是同一任务内的合成验证子任务，不是新的独立用户任务；无需重复执行前置或读取其他 Skill。保持本用例的无工具约束，只完成下面目标。


    请用中文审阅给定单一范围的前向与反向追踪，并核对两份材料的声明；只出有据草案。


    All records are fictional. Scope S2 contains two requirement statements R1/R2
    and two acceptance checks T1/T2.

    map.txt:L1 Caller meanings: C1/C2 are treatments; arrows run from requirement
    to treatment to acceptance.

    map.txt:L2 Complete supplied links: R1 -> C1; C1 -> T1; R2 -> C2. No other links
    are declared.

    summary.txt:L1 The summary claims all statements and checks are connected because
    both totals equal two.

    '
constraints:
  timeout_seconds: 300
  max_turns: 2
  tool_policy: none
expect:
  must_contain: &id001
  - R2
  - T2
judge:
  type: rule_based
  success:
  - output_contains:
      all: *id001
