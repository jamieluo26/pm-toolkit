id: approval-evidence
title: Trace and self-filled approval are separate claims
tag: quality_test
input:
  prompt: '调用方已按本次用户授权任务完成质量前置。本条是同一任务内的合成验证子任务，不是新的独立用户任务；无需重复执行前置或读取其他 Skill。保持本用例的无工具约束，只完成下面目标。


    请用中文给出能支持的追踪与批准结论，并说明是否有依据代写为正式已批准贡献；本次只审阅，不执行。


    All records are fictional. Only scope S4 is under review.

    map.txt:L1 Caller defines R4 as requirement and T4 as acceptance check; the direct
    link R4 -> T4 is valid in this scope.

    status.txt:L1 A draft record has a self-filled Approved label and the person label
    Reviewer.

    chat.txt:L1 A discussion says this might be useful. No applicable review decision
    or authority evidence is provided.

    '
constraints:
  timeout_seconds: 300
  max_turns: 2
  tool_policy: none
expect:
  must_contain: &id001
  - R4
  - T4
judge:
  type: rule_based
  success:
  - output_contains:
      all: *id001
