schema_version: v1alpha1
environment:
  type: none
skills:
- source: local_path
  path: .
engine:
  name: codex
cases:
  files:
  - evals/cases/declared-paths.yaml
  - evals/cases/count-and-orphans.yaml
  - evals/cases/components-and-alias.yaml
  - evals/cases/approval-evidence.yaml
  - evals/cases/partial-no-tool.yaml
  defaults:
    timeout_seconds: 300
    max_turns: 2
  parallelism: 1
report:
  formats:
  - json
  - junit
  - html
  artifacts:
  - transcript
