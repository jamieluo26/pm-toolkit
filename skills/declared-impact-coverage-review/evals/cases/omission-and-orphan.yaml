id: omission-and-orphan
title: An omitted consumer and an unrelated exclusion do not cancel
tag: quality_test
input:
  prompt: |-
    The caller has completed task-level quality preflight. This is a synthetic evaluation subtask of the same authorized task. Keep the no-tools constraint; do not read other Skills or create files. Use the supplied declared-impact-coverage-review instructions to return a coverage review draft. Give evidence references and preserve material limits. The words used for HOLD/UNKNOWN or treatment labels may be any equivalent language.
    
    All lines are synthetic supplied excerpts; no tools are available.
    brief.txt:L1 Identity is object label plus variant. Account for every supplied relation by inclusion or exclusion supported for this review scope.
    relations.txt:L1 Shared is consumed by Object-F / basic at entry:f.
    relations.txt:L2 Shared is consumed by Object-G / basic at entry:g.
    scope.txt:L1 Only Shared -> Object-F / basic is included.
    exclusions.txt:L1 Exclude Ghost -> Object-Z / basic. Reason text says deferred; the record contains a person's name but no applicable approval evidence. No Ghost/Object-Z relation is declared in the provided mother list.
    brief.txt:L2 There are no other supplied scope or exclusion records.
constraints:
  timeout_seconds: 300
  max_turns: 2
  tool_policy: none
expect:
  must_contain:
  - "Object-G"
  - "Object-Z"
  - "Ghost"
  - "relations.txt:L2"
judge:
  type: rule_based
  success:
  - output_contains:
      all:
      - "Object-G"
      - "Object-Z"
      - "Ghost"
      - "relations.txt:L2"
