id: documented-subset-exclusion
title: Bounded support for a supplied subset exclusion
tag: quality_test
input:
  prompt: |-
    The caller has completed task-level quality preflight. This is a synthetic evaluation subtask of the same authorized task. Keep the no-tools constraint; do not read other Skills or create files. Use the supplied declared-impact-coverage-review instructions to return a coverage review draft. Give evidence references and preserve material limits. The words used for HOLD/UNKNOWN or treatment labels may be any equivalent language.
    
    All material is synthetic, quoted and not independently verified. No tools are available.
    brief.txt:L1 Identity is object label plus variant. For this review, each supplied consumer must be included or have an exclusion supported for this precise review scope.
    relations.txt:L1 Shared is consumed by Object-C / compact at entry:c.
    relations.txt:L2 Shared is consumed by Object-D / expanded at entry:d.
    scope.txt:L1 Include only Shared -> Object-C / compact; propose excluding Shared -> Object-D / expanded in Draft-R.
    approval.txt:L1 The caller provides this approval excerpt for Draft-R: the designated scope owner approved excluding only Shared -> Object-D / expanded because its delivery is in Draft-S. The excerpt does not authorize other exclusions, actual code changes or publication.
    brief.txt:L2 Review the supplied support, without independently verifying the person's real authority or approval authenticity.
constraints:
  timeout_seconds: 300
  max_turns: 2
  tool_policy: none
expect:
  must_contain:
  - "Object-C"
  - "Object-D"
  - "approval.txt:L1"
  - "Shared"
judge:
  type: rule_based
  success:
  - output_contains:
      all:
      - "Object-C"
      - "Object-D"
      - "approval.txt:L1"
      - "Shared"
