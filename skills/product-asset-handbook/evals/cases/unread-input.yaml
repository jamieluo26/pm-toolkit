id: unread-input
title: Missing reading tool leaves input unread
tag: quality_test
input:
  prompt: '调用方已按本次用户授权任务完成质量前置。本条是同一任务内的合成验证子任务，不是新的独立用户任务；无需重复执行前置或读取其他 Skill。保持本用例的无工具约束，只完成下面目标。


    请说明在以下实际条件下能交付什么、不能确认什么，以及最小恢复条件。不要使用任何工具。


    The user identifies handbook-source.md with 40 lines, but supplies no content.

    No file-reading tool is available in this exercise; the file has not been read.

    The requested product is Sample Shelf Notes. No production evidence is supplied.

    '
constraints:
  timeout_seconds: 240
  max_turns: 2
  tool_policy: none
expect:
  must_contain: &id001
  - HOLD
  - '40'
  - 生产
  must_not_contain:
  - 已完整读取handbook-source.md
  - 全文审查已完成
judge:
  type: rule_based
  success:
  - output_contains:
      all: *id001
