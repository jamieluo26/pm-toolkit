id: explicit-complete-matrix
title: Declared units remain independent even with complete supplied observations
tag: quality_test
input:
  prompt: '调用方已按本次用户授权任务完成质量前置。本条是同一任务内的合成验证子任务，不是新的独立用户任务；无需重复执行前置或读取其他 Skill。保持本用例的无工具约束，只完成下面目标。


    请用中文审阅这份给定验收材料，逐条件、状态、维度保留引用，说明材料能支持什么；只给证据审阅草案。


    All records are fictional. Only the supplied text is visible.

    scope.txt:L1 Review Q1 concerns object Panel in version VQ, environment sandbox-record,
    time t1. Caller conditions A1 and A2 apply to states idle and expanded, each with
    behavior and appearance dimensions.

    criteria.txt:L1 A1: in idle, request opens a preview and a small frame is visible;
    in expanded, request closes the preview and a large frame is visible.

    criteria.txt:L2 A2: in idle, export produces a preview file and a pale badge is
    visible; in expanded, export produces a detail file and a dark badge is visible.

    observations.txt:L1 O11: Q1/Panel/VQ/sandbox-record/t1/A1/idle/behavior: request
    opens a preview.

    observations.txt:L2 O12: same scope A1/idle/appearance: small frame reported visible.

    observations.txt:L3 O13: same scope A1/expanded/behavior: request closes the preview.

    observations.txt:L4 O14: same scope A1/expanded/appearance: large frame reported
    visible.

    observations.txt:L5 O15: same scope A2/idle/behavior: export produces a preview
    file.

    observations.txt:L6 O16: same scope A2/idle/appearance: pale badge reported visible.

    observations.txt:L7 O17: same scope A2/expanded/behavior: export produces a detail
    file.

    observations.txt:L8 O18: same scope A2/expanded/appearance: dark badge reported
    visible.

    boundary.txt:L1 These are supplied observation statements, not actions or images
    from this review session. No API, permission, production, approval or release
    evidence is supplied.

    '
constraints:
  timeout_seconds: 300
  max_turns: 2
  tool_policy: none
expect:
  must_contain: &id001
  - A1
  - A2
  - O18
judge:
  type: rule_based
  success:
  - output_contains:
      all: *id001
