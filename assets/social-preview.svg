<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">PM Toolkit</title><desc id="desc">Original project preview showing a product task, prototype and documents, and review and handoff.</desc><rect width="1280" height="640" fill="#f6f6ef"/><path d="M850 0H1280V640H1110L850 380Z" fill="#e9eee1"/><g font-family="Arial,sans-serif"><rect x="66" y="58" width="52" height="52" rx="10" fill="#2b5d40"/><text x="78" y="93" font-size="27" font-weight="700" fill="#fff">P/</text><text x="138" y="94" font-size="28" font-weight="700" fill="#263d2c">PM Toolkit</text><text x="68" y="199" font-size="14" letter-spacing="2" fill="#728569">A LOCAL WORKING KIT FOR PRODUCT MANAGERS</text><g font-size="56" font-weight="700" fill="#243c2c"><text x="65" y="280">From product questions</text><text x="65" y="349">to verifiable handoffs.</text></g><text x="68" y="411" font-size="21" fill="#64765d">Requirements, prototypes, matching documents</text><text x="68" y="444" font-size="21" fill="#64765d">and a traceable review process.</text><g transform="translate(927 177)"><rect width="283" height="89" rx="13" fill="#fffef9" stroke="#c8d5bf"/><text x="23" y="36" font-size="13" fill="#84927a">01 / START WITH THE TASK</text><text x="23" y="65" font-size="22" fill="#2e5234">Problem + scope</text><path d="M141 99v17m-5-5 5 5 5-5" stroke="#839b76" fill="none"/><rect y="128" width="283" height="89" rx="13" fill="#2b5d40"/><text x="23" y="164" font-size="13" fill="#c6d9bb">02 / ONE SOURCE</text><text x="23" y="193" font-size="22" fill="#fff">Prototype + PRD + Word</text><path d="M141 228v17m-5-5 5 5 5-5" stroke="#839b76" fill="none"/><rect y="257" width="283" height="89" rx="13" fill="#fffef9" stroke="#c8d5bf"/><text x="23" y="293" font-size="13" fill="#84927a">03 / KEEP THE EVIDENCE</text><text x="23" y="322" font-size="22" fill="#2e5234">Review + handoff</text></g><path d="M68 535H824" stroke="#ccd7c4"/><text x="68" y="576" font-size="13" letter-spacing="1.5" fill="#6b8061">LOCAL FILES   /   WORKED EXAMPLES   /   HUMAN DECISIONS</text></g></svg>