<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">从材料到判断的PM Skills路径</title><desc id="d">给出材料，使用Skill，阅读有依据的草案，由产品经理核对和决定。</desc><rect width="1200" height="340" rx="24" fill="#f3f5ed"/><g font-family="system-ui,-apple-system,sans-serif" fill="#183e34"><text x="44" y="58" font-size="20" font-weight="700">PM TOOLKIT / SKILLS + EXAMPLES</text><text x="44" y="109" font-size="34" font-weight="700">把一段材料，变成一个更清楚的决定。</text></g><g font-family="system-ui,-apple-system,sans-serif"><rect x="44" y="156" width="240" height="112" rx="14" fill="white"/><rect x="334" y="156" width="240" height="112" rx="14" fill="white"/><rect x="624" y="156" width="240" height="112" rx="14" fill="white"/><rect x="914" y="156" width="240" height="112" rx="14" fill="#205d49"/><g font-size="24" font-weight="700" fill="#183e34"><text x="66" y="201">一段明确材料</text><text x="356" y="201">一个适用 Skill</text><text x="646" y="201">有依据的草案</text></g><g font-size="16" fill="#5a695e"><text x="66" y="239">讨论 · 需求 · 反馈 · 证据</text><text x="356" y="239">完整方法 + 可复制案例</text><text x="646" y="239">具体发现 · 引用 · 未决项</text></g><text x="936" y="201" font-size="24" font-weight="700" fill="white">PM 核对与决定</text><text x="936" y="239" font-size="16" fill="#d9e9dc">采用 · 补料 · 继续推进</text><g font-size="26" fill="#63806c"><text x="299" y="219">→</text><text x="589" y="219">→</text><text x="879" y="219">→</text></g><text x="44" y="307" font-size="16" fill="#5a695e">先看案例，再直接试用。文字路径无需 Python、本地服务或完整规格表。</text></g></svg>