<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>PM Toolkit 实际操作短演示</title><style>body{margin:0;background:#f6f6ef;color:#263a31;font:16px/1.8 system-ui}main{max-width:1280px;margin:32px auto;padding:24px}h1{font-size:34px}img{width:100%;display:block;border:1px solid #ccd7c6;border-radius:10px;background:white}button,a{padding:10px 18px;border:1px solid #bccbb5;border-radius:7px;color:#2d6247;background:white;cursor:pointer}nav{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}small{color:#697a61}#caption{min-height:3em}button:focus-visible{outline:3px solid #a46d41}button[aria-pressed=true]{background:#2d6247;color:white}</style></head><body><main><a href="index.html">← 工具包首页</a><p><a href="walkthrough.html">查看创建→修订→交接完整演示 →</a></p><h1>一次筛选与恢复的实际操作</h1><p>下面三帧来自同一版本阅读清单在 Chrome 中的实际操作。可逐步查看或自动播放；它是制作记录，完整交互请打开原型。</p><nav aria-label="演示步骤"><button data-step="0" aria-pressed="true">1 默认集合</button><button data-step="1" aria-pressed="false">2 交集筛选</button><button data-step="2" aria-pressed="false">3 无结果与恢复</button><button id="play">自动播放</button></nav><p id="caption" aria-live="polite">默认显示3条书目，顶部提供进度与主题筛选。</p><img id="frame" src="assets/demo-01-default.png" alt="默认3条书目的实际页面"><p><a href="examples/lifecycle/after-output/prototype.html">打开同版可交互原型 ↗</a> <a href="examples/lifecycle/README.md" download>完整迭代说明 ↓</a></p><small>合成材料 · 任务reading_lifecycle 2.1 · 只证明所示操作条件。图片未经拼接模拟，来源标识与本版制品绑定。</small></main><script>const frames=[['assets/demo-01-default.png','默认显示3条书目，顶部提供进度与主题筛选。'],['assets/demo-02-filter.png','进度“待读”与主题“设计”取交集，显示河岸手册1条。'],['assets/demo-03-empty.png','主题“历史”没有命中；恢复全部入口仍在，可回到完整集合。']];let at=0,timer=null;function show(n){at=n;document.querySelector('#frame').src=frames[n][0];document.querySelector('#frame').alt=frames[n][1];document.querySelector('#caption').textContent=frames[n][1];document.querySelectorAll('[data-step]').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)));}document.querySelectorAll('[data-step]').forEach((b,i)=>b.addEventListener('click',()=>show(i)));document.querySelector('#play').addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;document.querySelector('#play').textContent='自动播放';}else{timer=setInterval(()=>show((at+1)%3),2200);document.querySelector('#play').textContent='暂停播放';}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer){clearInterval(timer);timer=null;document.querySelector('#play').textContent='自动播放';}});</script></body></html>
